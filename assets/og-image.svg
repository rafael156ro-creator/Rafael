<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b7dff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1b2740" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <text x="90" y="270" font-family="'Space Grotesk', sans-serif" font-size="72" font-weight="700" fill="#eaf0fb">Rafael Rodrigues</text>
  <text x="90" y="330" font-family="'JetBrains Mono', monospace" font-size="30" fill="#6fa2ff">&lt;/&gt; Desenvolvedor Web</text>
  <text x="90" y="400" font-family="Inter, sans-serif" font-size="24" fill="#93a1bd">Sites modernos, rápidos e profissionais</text>
  <circle cx="1060" cy="150" r="4" fill="#22d3ee"/>
  <circle cx="1000" cy="500" r="3" fill="#3b7dff"/>
  <circle cx="1100" cy="450" r="3" fill="#22d3ee"/>
